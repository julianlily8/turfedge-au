name: Pre-Jump Analysis & Gemini Batch (T-5..T-60m)

on:
  schedule:
    # Off-peak 15-minute schedule during Australian racing hours (approx 09:07 - 19:52 AEDT / 08:07 - 18:52 AEST).
    # Job widens its scan window to T-5..T-60 minutes so cron jitter never skips a race.
    - cron: '7,22,37,52 22-23 * * *'
    - cron: '7,22,37,52 0-9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date YYYY-MM-DD (defaults to today in Australia/Sydney)'
        required: false
        default: ''
      force_all:
        description: 'Analyze all open races regardless of jump window (true/false)'
        required: false
        default: 'false'

concurrency:
  group: pre-jump-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Pre-Jump Analysis Pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LADBROKES_FROM_EMAIL: ${{ secrets.LADBROKES_FROM_EMAIL }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: python -m pipeline.src.jobs.pre_jump_analyze
