name: Post-Race Settlement & Betfair BSP Sync

on:
  schedule:
    # Every 45 minutes on off-peak minutes during/after AU racing hours (11:13 AM - 12:58 AM AEDT)
    - cron: '13,58 0-13 * * *'
    # Betfair publishes yesterday's daily BSP CSV around 01:10 UTC (~12:10 PM AEDT); sync at 01:30 UTC (12:30 PM AEDT)
    - cron: '30 1 * * *'
    # Morning carry-over settlement & BSP reconciliation (9:17 AM AEDT / 8:17 AM AEST)
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date YYYY-MM-DD (defaults to today & yesterday in Australia/Sydney)'
        required: false
        default: ''

concurrency:
  group: post-race-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Post-Race Settlement & BSP Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          LADBROKES_FROM_EMAIL: ${{ secrets.LADBROKES_FROM_EMAIL }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: python -m pipeline.src.jobs.post_race_settle
