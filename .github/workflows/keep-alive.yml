name: Monthly Workflow Keep-Alive (Prevent 60-Day Auto-Disable)

on:
  schedule:
    # Runs monthly on the 1st at 03:19 UTC (off-peak minute)
    - cron: '19 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled racing workflows via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          WORKFLOWS=(
            "morning-ingest.yml"
            "pre-jump-analysis.yml"
            "post-race-settle.yml"
            "keep-alive.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            echo "Enabling workflow: ${wf}"
            curl -fsSL -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/enable" || true
          done
          echo "Keep-alive completed successfully."
