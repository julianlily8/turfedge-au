name: Morning Race Ingestion (8:30 AM AEDT/AEST)

on:
  schedule:
    # Off-peak minutes to avoid top-of-hour GitHub Actions queue congestion.
    # 21:27 UTC = 8:27 AM AEDT (UTC+11); 22:27 UTC = 8:27 AM AEST (UTC+10).
    # Python script enforces Australia/Sydney 08:xx local-hour guard so it runs once daily.
    - cron: '27 21 * * *'
    - cron: '27 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date YYYY-MM-DD (defaults to today in Australia/Sydney)'
        required: false
        default: ''
      force:
        description: 'Bypass local-hour timezone guard'
        required: false
        default: 'true'

concurrency:
  group: morning-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Morning Ingestion Pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          LADBROKES_FROM_EMAIL: ${{ secrets.LADBROKES_FROM_EMAIL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: python -m pipeline.src.jobs.morning_ingest
